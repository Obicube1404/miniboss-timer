
name: Build MiniBoss Timer

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Show files
        run: |
          pwd
          ls -la
          ls -la miniboss-timer

      - name: Build mod
        working-directory: miniboss-timer
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: miniboss-timer-jar
          path: miniboss-timer/build/libs/*.jar
