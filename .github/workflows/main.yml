
name: Build MiniBoss Timer

on:
  workflow_dispatch:
  push:
    paths:
      - "miniboss-timer/**"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build mod
        working-directory: miniboss-timer
        run: chmod +x gradlew && ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: miniboss-timer-jar
          path: miniboss-timer/build/libs/*.jar
